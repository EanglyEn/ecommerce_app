name: ecommerce_app
description: A simple e-commerce Flutter app using Riverpod.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  image_picker: ^1.2.3
  share_plus: ^13.3.0
  shimmer: ^3.0.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  generate: true
  uses-material-design: true